<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Scale / Resize — SnapURL</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"></head><body><div class="advanced-shell"><nav class="advanced-nav"><a class="brand" href="/"><span class="brand-mark"><img src="/favicon.svg" alt=""></span><span>SnapURL</span></a><a class="back-link" href="/">← Back to SnapURL</a></nav><section class="tool-hero"><div class="tool-hero-icon">✦</div><h1>PDF Scale / Resize</h1><p>Enlarge or reduce PDF page dimensions with a percentage control, while keeping the document in your browser.</p></section><main class="advanced-workspace">
