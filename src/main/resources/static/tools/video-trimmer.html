<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Trimmer — SnapURL</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/tool-pages.css"></head><body><div class="app-shell"><nav class="navbar"><a class="brand" href="/"><span class="brand-mark"><img src="/favicon.svg" alt=""></span><span>SnapURL</span></a><a class="small-btn" href="/">← Back</a></nav><main><section class="tool-hero"><div class="eyebrow"><span class="dot"></span> local video editor</div><h1>Video <span class="gradient-text">Trimmer.</span></h1><p class="hero-copy">Select a local video, choose start and end points, preview the range, and export the selected clip as WebM. Your video stays in the browser.</p></section><section class="tool-panel"><div class="field"><label for="videoInput">Video file</label><input id="videoInput" type="file" accept="video/*"></div><video id="video" controls class="media-preview"></video><div class="range-grid"><label>Start (seconds)<input id="start" type="number" min="0" step=".1" value="0"></label><label>End (seconds)<input id="end" type="number" min="0" step=".1"></label></div><div class="tool-actions"><button class="primary-btn" id="trim">Trim & Export WebM</button></div><div class="tool-output" id="out"></div></section></main><footer><span>SnapURL v1.0 © <span id="year"></span></span></footer></div><script>const $=s=>document.querySelector(s);let file=null;$('#videoInput').onchange=()=>{file=$('#videoInput').files[0]||null;if(!file)return;const v=$('#video');v.src=URL.createObjectURL(file);v.onloadedmetadata=()=>$('#end').value=v.duration.toFixed(2)};$('#trim').onclick=async()=>{if(!file)return $('#out').textContent='Choose a video first.';const v=$('#video'),start=Math.max(0,+$('#start').value||0),end=Math.min(v.duration,+$('#end').value||v.duration);if(end<=start)return $('#out').textContent='End time must be greater than start time.';if(!window.MediaRecorder)return $('#out').textContent='This browser does not support MediaRecorder export.';try{const stream=v.captureStream?v.captureStream():v.mozCaptureStream();const chunks=[];const rec=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp9,opus'});rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);const done=new Promise((resolve,reject)=>{rec.onstop=resolve;rec.onerror=e=>reject(e.error||e)});v.currentTime=start;await v.play();rec.start(250);await new Promise(resolve=>{const tick=()=>v.currentTime>=end?resolve():requestAnimationFrame(tick);tick()});v.pause();rec.stop();await done;stream.getTracks().forEach(t=>t.stop());const blob=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='snapurl-trimmed-video.webm';a.click();$('#out').textContent='Done — trimmed clip exported as WebM.'}catch(e){$('#out').textContent='Export failed. Try Chrome/Edge with a local video.'}};$('#year').textContent=new Date().getFullYear();</script></body></html>
