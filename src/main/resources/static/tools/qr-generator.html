<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator — SnapURL</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"></head><body><div class="advanced-shell"><nav class="advanced-nav"><a class="brand" href="/"><span class="brand-mark"><img src="/favicon.svg" alt=""></span><span>SnapURL</span></a><a class="back-link" href="/">← Back to SnapURL</a></nav><section class="tool-hero"><div class="tool-hero-icon">✦</div><h1>QR Code Generator</h1><p>Generate useful QR codes for links, contacts, text, SMS, Gmail, maps, phone numbers and social handles.</p></section><main class="advanced-workspace">
<div class="qr-layout"><div>
<div class="control-card"><h3>QR type</h3><select id="qrType">
<option value="url">URL</option><option value="pdf">PDF / document URL</option><option value="contact">Contact</option><option value="text">Plain Text</option><option value="app">App</option><option value="sms">SMS</option><option value="gmail">Gmail</option><option value="gmap">G-Maps</option><option value="location">Location</option><option value="phone">Phone</option><option value="instagram">Instagram</option><option value="youtube">YouTube</option><option value="snapchat">Snapchat</option><option value="whatsapp">WhatsApp</option><option value="linkedin">LinkedIn</option><option value="github">GitHub</option>
</select><div id="qrFields" style="margin-top:12px"></div></div>
<div class="control-card"><h3>QR options</h3><div class="control-grid"><label>Size<input id="qrSize" type="number" min="128" max="1024" value="512"></label><label>Error correction<select id="qrLevel"><option value="L">L</option><option value="M" selected>M</option><option value="Q">Q</option><option value="H">H</option></select></label><label>Foreground<input id="qrDark" type="color" value="#171923"></label><label>Background<input id="qrLight" type="color" value="#ffffff"></label></div></div>
</div><div><div class="qr-preview" id="qrPreview"><span class="muted">Your QR code will appear here.</span></div><div class="workspace-actions"><button class="gradient-action" id="downloadQr">Download PNG</button><button class="small-btn" id="copyQrPayload">Copy payload</button></div></div></div>
<div class="control-card" style="margin-top:14px"><h3>QR history</h3><div id="qrHistory" class="qr-history"></div></div><div id="qrOutput" class="status-line"></div></main><footer><span>SnapURL v1.0 © <span id="currentYear"></span></span></footer></div><div class="toast" id="toast"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="/advanced-tools.js"></script><script>document.getElementById("currentYear").textContent=new Date().getFullYear();</script></body></html>
