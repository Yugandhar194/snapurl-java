<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Trimmer & Merger — SnapURL</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/tool-pages.css"></head><body><div class="app-shell"><nav class="navbar"><a class="brand" href="/"><span class="brand-mark"><img src="/favicon.svg" alt=""></span><span>SnapURL</span></a><a class="small-btn" href="/">← Back</a></nav><main><section class="tool-hero"><div class="eyebrow"><span class="dot"></span> browser-first audio tools</div><h1>Audio <span class="gradient-text">Trimmer & Merger.</span></h1><p class="hero-copy">Trim audio clips, merge multiple files in order, preview them, and export a WAV file. Processing happens locally in your browser.</p></section><section class="tool-panel"><div class="field"><label for="audioInput">Audio files</label><input id="audioInput" type="file" accept="audio/*" multiple></div><div id="audioList" class="tool-list"></div><div class="tool-actions"><button class="primary-btn" id="mergeBtn">Merge / Export WAV</button><button class="small-btn" id="clearBtn">Clear</button></div><div class="tool-output" id="audioOutput"></div></section></main><footer><span>SnapURL v1.0 © <span id="currentYear"></span></span></footer></div><script>const $=s=>document.querySelector(s);const items=[];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const box=$('#audioList');box.innerHTML=items.length?items.map((x,i)=>`<div class="tool-list-row"><div><b>${i+1}. ${esc(x.file.name)}</b><div class="muted">${(x.file.size/1024/1024).toFixed(2)} MB</div></div><label>Start <input class="audio-start" data-i="${i}" type="number" min="0" step=".1" value="${x.start}">s</label><label>End <input class="audio-end" data-i="${i}" type="number" min="0" step=".1" value="${x.end}">s</label><audio controls src="${URL.createObjectURL(x.file)}"></audio><button class="small-btn" data-remove="${i}">Remove</button></div>`).join(''):'<div class="empty">Choose one or more audio files.</div>';box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{items.splice(+b.dataset.remove,1);render()});box.querySelectorAll('.audio-start').forEach(e=>e.oninput=()=>items[+e.dataset.i].start=+e.value||0);box.querySelectorAll('.audio-end').forEach(e=>e.oninput=()=>items[+e.dataset.i].end=e.value===''?null:+e.value)}$('#audioInput').onchange=async()=>{for(const file of $('#audioInput').files){const a=new Audio();a.src=URL.createObjectURL(file);await new Promise(r=>{a.onloadedmetadata=r;a.onerror=r});items.push({file,start:0,end:Number.isFinite(a.duration)?a.duration:null})}render()};async function decode(file,ctx){return ctx.decodeAudioData(await file.arrayBuffer())}function wavBuffer(channels,sampleRate){let len=channels[0].length,nc=channels.length,buf=new ArrayBuffer(44+len*nc*2),v=new DataView(buf),p=0;const ws=(s,o)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};ws('RIFF',0);v.setUint32(4,36+len*nc*2,true);ws('WAVE',8);ws('fmt ',12);v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nc,true);v.setUint32(24,sampleRate,true);v.setUint32(28,sampleRate*nc*2,true);v.setUint16(32,nc*2,true);v.setUint16(34,16,true);ws('data',36);v.setUint32(40,len*nc*2,true);for(let i=0,o=44;i<len;i++)for(let c=0;c<nc;c++,o+=2){let s=Math.max(-1,Math.min(1,channels[c][i]||0));v.setInt16(o,s<0?s*32768:s*32767,true)}return buf}$('#mergeBtn').onclick=async()=>{if(!items.length)return $('#audioOutput').textContent='Choose at least one audio file.';try{const ctx=new AudioContext(),decoded=[];for(const x of items){const b=await decode(x.file,ctx),start=Math.max(0,x.start||0),end=Math.min(b.duration,x.end==null?b.duration:x.end);if(end<=start)continue;const n=Math.floor((end-start)*b.sampleRate),ch=Array.from({length:b.numberOfChannels},(_,c)=>b.getChannelData(c).slice(Math.floor(start*b.sampleRate),Math.floor(start*b.sampleRate)+n));decoded.push({ch,sr:b.sampleRate})}if(!decoded.length)throw Error('No valid audio ranges selected');const sr=decoded[0].sr,nc=Math.max(...decoded.map(x=>x.ch.length)),total=decoded.reduce((n,x)=>n+x.ch[0].length,0),out=Array.from({length:nc},()=>new Float32Array(total));let off=0;for(const x of decoded){for(let c=0;c<nc;c++){const src=x.ch[c]||x.ch[0];out[c].set(src,off)}off+=x.ch[0].length}const blob=new Blob([wavBuffer(out,sr)],{type:'audio/wav'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='snapurl-audio-merged.wav';a.click();$('#audioOutput').textContent='Done — merged audio exported as WAV.'}catch(e){$('#audioOutput').textContent=e.message||'Audio processing failed.'}};$('#clearBtn').onclick=()=>{items.length=0;$('#audioInput').value='';render()};$('#currentYear').textContent=new Date().getFullYear();render();</script></body></html>
