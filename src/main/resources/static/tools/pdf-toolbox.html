<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Toolbox — SnapURL</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/theme.css"></head><body><div class="advanced-shell"><nav class="advanced-nav"><a class="brand" href="/"><span class="brand-mark"><img src="/favicon.svg" alt=""></span><span>SnapURL</span></a><a class="back-link" href="/">← Back to SnapURL</a></nav><section class="tool-hero"><div class="tool-hero-icon">✦</div><h1>PDF Toolbox</h1><p>A focused browser-side PDF workspace for merging, extracting, rotating and previewing pages.</p></section><main class="advanced-workspace">
<div class="advanced-grid"><div class="control-card"><h3>Merge PDFs</h3><input id="mergeInput" type="file" accept="application/pdf" multiple><button class="gradient-action" id="mergePdf" style="margin-top:12px">Merge PDFs</button><div id="mergeOutput" class="status-line"></div></div>
<div class="control-card"><h3>Extract pages</h3><input id="extractInput" type="file" accept="application/pdf"><label style="margin-top:10px">Pages<input id="extractPages" placeholder="1,3,5-7"></label><button class="gradient-action" id="extractPdf" style="margin-top:12px">Extract pages</button><div id="extractOutput" class="status-line"></div></div>
<div class="control-card"><h3>Rotate PDF</h3><input id="rotateInput" type="file" accept="application/pdf"><label style="margin-top:10px">Degrees<select id="rotateDegrees"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><button class="gradient-action" id="rotatePdf" style="margin-top:12px">Rotate pages</button><div id="rotateOutput" class="status-line"></div></div>
<div class="control-card"><h3>PDF → JPG</h3><input id="pdfJpgInput" type="file" accept="application/pdf"><p class="muted">Exports the first page as a JPG preview image.</p><button class="gradient-action" id="pdfToJpg" style="margin-top:12px">Export first page</button><div id="pdfJpgOutput" class="status-line"></div></div></div></main><footer><span>SnapURL v1.0 © <span id="currentYear"></span></span></footer></div><div class="toast" id="toast"></div><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="/advanced-tools.js"></script><script>document.getElementById("currentYear").textContent=new Date().getFullYear();</script></body></html>
